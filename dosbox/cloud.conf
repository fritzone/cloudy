# DOSBox-X configuration for developing cloud.exe
#
# Use it via ./dosbox/run.sh from the project root, which mounts the
# project root as C: and starts dosbox-x with this file.
#
# Networking: emulated NE2000 card with the built-in slirp (user mode NAT)
# backend, no root or bridge setup needed. Inside DOS:
#   - this machine is      10.0.2.15
#   - the Linux host is    10.0.2.2  (maps to the host's 127.0.0.1)
#   - the DNS server is    10.0.2.3

[sdl]
output = surface

[dosbox]
machine = svga_s3
memsize = 16

[cpu]
core   = normal
cycles = max

[ne2000]
ne2000  = true
nicbase = 300
nicirq  = 10
macaddr = auto
backend = slirp

[ethernet, slirp]
ipv4_network    = 10.0.2.0
ipv4_netmask    = 255.255.255.0
ipv4_host       = 10.0.2.2
ipv4_nameserver = 10.0.2.3
ipv4_dhcp_start = 10.0.2.15

[autoexec]
@echo off
mount c .
c:
set MTCPCFG=C:\DOSBOX\MTCP.CFG
C:\EXT\DOS\NE2000.COM 0x60 0xa 0x300
